# novel-boom configuration
# Copy to config.toml and adjust as needed:
#   cp config.example.toml config.toml

[app]
# Check for updates on startup
auto_update = false
# GitHub proxy prefix when releases cannot be reached directly
gh_proxy = ""
# Cloudflare bypass service base URL (optional)
cf_bypass = ""

[download]
# Output directory for downloaded books
path = "downloads"
# Export format: txt | epub | html | pdf
format = "epub"
# Encoding used when format = "txt"
txt_encoding = "UTF-8"
# Keep per-chapter cache directory after export
preserve_chapter_cache = false

[source]
# Content language: "" = auto, or zh-CN / zh-TW / zh-Hant
language = ""
# Active rule pack filename under rules/
active_rules = "main.json"
# Pin a source id for single-source search (0 = unset)
source_id = 0
# Max hits kept per source (0 = unlimited)
search_limit = 30
# Drop low-similarity search hits
search_filter = true

[crawl]
# Max concurrent chapter downloads (0 = automatic, typically min(50, n))
concurrency = 0
min_interval_ms = 200
max_interval_ms = 400
retry = true
max_retries = 3
retry_min_interval_ms = 2000
retry_max_interval_ms = 4000

[proxy]
enabled = false
host = "127.0.0.1"
port = 7890

[cookie]
# Optional Qidian cookie fragment for cover refresh (w_tsfp=...)
qidian = ""
